<!DOCTYPE html>
<html lang="es-AR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Página no encontrada — Tikera</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%233E5670'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-weight='700' font-size='32' fill='white' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --counter:#0D1113;
    --card:#12171A;
    --ink:#F4F2ED;
    --ink-soft:#9BA3A6;
    --line:rgba(244,242,237,0.10);
    --accent:#3E5670;
    --venta:#4CAF80;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;min-height:100vh;background:var(--counter);color:var(--ink);
    font-family:'Inter',sans-serif;
    display:flex;align-items:center;justify-content:center;
    padding:24px 16px;position:relative;overflow:hidden;
  }
  body::before,body::after{
    content:'';position:absolute;border-radius:50%;filter:blur(70px);pointer-events:none;z-index:0;
  }
  body::before{top:-15%;left:-12%;width:55%;height:55%;background:radial-gradient(circle, rgba(76,175,128,0.28), transparent 70%);}
  body::after{bottom:-20%;right:-14%;width:60%;height:60%;background:radial-gradient(circle, rgba(62,86,112,0.42), transparent 70%);}
  .card{
    position:relative;z-index:1;text-align:center;max-width:420px;width:100%;
    background:var(--card);border:1px solid rgba(244,242,237,0.06);border-radius:24px;
    padding:44px 32px;box-shadow:0 20px 50px rgba(0,0,0,0.35);
  }
  .badge{
    width:38px;height:38px;border-radius:9px;background:var(--accent);color:#fff;
    display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk';
    font-weight:700;font-size:17px;margin:0 auto 22px;
  }
  .code{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:15px;color:var(--venta);letter-spacing:.04em;margin-bottom:10px;}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:24px;margin:0 0 10px;}
  p{font-size:14.5px;color:var(--ink-soft);line-height:1.6;margin:0 0 28px;}
  .actions{display:flex;flex-direction:column;gap:10px;}
  .btn{
    display:block;padding:13px 0;border-radius:999px;text-decoration:none;
    font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:14.5px;
    transition:transform .15s ease, filter .15s ease;
  }
  .btn:hover{transform:translateY(-1px);}
  .btn-primary{background:var(--venta);color:#0D1113;}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;color:var(--ink);border:1px solid var(--line);}
  .btn-ghost:hover{border-color:rgba(244,242,237,0.3);}
</style>
</head>
<body>
  <div class="card">
    <div class="badge">T</div>
    <div class="code">Error 404</div>
    <h1>Esta página no existe</h1>
    <p>El link que seguiste está roto o la página se movió. Volvamos a algo que sí existe.</p>
    <div class="actions">
      <a href="/Tikera/tikera-landing.html" class="btn btn-primary">Ir al inicio</a>
      <a href="/Tikera/index.html" class="btn btn-ghost">Abrir la app</a>
    </div>
  </div>
</body>
</html>
